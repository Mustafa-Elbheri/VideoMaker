    const params = new URLSearchParams(location.search);
    const selected = shortcutPages[params.get("lang")] ? params.get("lang") : "ar";
    const page = shortcutPages[selected];

    document.documentElement.dir = page.dir;
    document.title = page.title;
    const content = document.getElementById("content");
    const heading = document.createElement("h1");
    heading.textContent = page.title;
    content.appendChild(heading);
    for (const [sectionTitle, rows] of page.sections) {
      const section = document.createElement("section");
      const h2 = document.createElement("h2");
      h2.textContent = sectionTitle;
      section.appendChild(h2);
      const table = document.createElement("table");
      const thead = document.createElement("thead");
      const headerRow = document.createElement("tr");
      for (const label of [page.shortcut, page.action]) {
        const th = document.createElement("th");
        th.textContent = label;
        headerRow.appendChild(th);
      }
      thead.appendChild(headerRow);
      table.appendChild(thead);
      const tbody = document.createElement("tbody");
      for (const [shortcut, action] of rows) {
        const tr = document.createElement("tr");
        const shortcutCell = document.createElement("td");
        const separator = selected === "ar" ? " أو " : selected === "fr" ? " ou " : " or ";
        const pieces = shortcut.split(/\s(?:or|ou|أو)\s/);
        for (let index = 0; index < pieces.length; index += 1) {
          if (index > 0) {
            shortcutCell.appendChild(document.createTextNode(separator));
          }
          const kbd = document.createElement("kbd");
          kbd.textContent = pieces[index];
          shortcutCell.appendChild(kbd);
        }
        const actionCell = document.createElement("td");
        actionCell.textContent = action;
        tr.appendChild(shortcutCell);
        tr.appendChild(actionCell);
        tbody.appendChild(tr);
      }
      table.appendChild(tbody);
      section.appendChild(table);
      content.appendChild(section);
    }
